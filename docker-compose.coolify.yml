# Coolify deployment.
#
# In Coolify: + New Resource → Docker Compose → point at this repository and
# set "Docker Compose Location" to /docker-compose.coolify.yml. The image is
# built by GitHub Actions (.github/workflows/image.yml) and pulled from GHCR,
# so the deploy host never compiles anything. Coolify wires its proxy to port
# 7420 via the SERVICE_FQDN magic variable below (set your domain on the
# resource, or let Coolify generate one), provisions the data volume, and
# uses the healthcheck for status/rolling restarts. SSE streams work through
# the proxy as-is. Turn off Coolify's auto-deploy-on-push and let the
# workflow's webhook step redeploy once the new image exists.
#
# The API is unauthenticated by design (trusted single-tenant) — keep the
# resource internal or put Coolify's auth/allowlist in front if exposed.

services:
  loom:
    image: ghcr.io/danielmcsheehy/rust-orchestrator:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      # Coolify replaces this with the resource's FQDN and routes it to :7420.
      # Use SERVICE_FQDN_LOOM (service name) — Coolify auto-routes the single
      # exposed port. The _7420 suffix variant (SERVICE_FQDN_<svc>_<port>) is
      # only needed for multi-port services and confuses older Coolify parsers
      # (they look for service `loom_7420` → 404 on the generated sslip.io).
      - SERVICE_FQDN_LOOM
      - RUST_LOG=info
      - LOOM_PORT=7420
      - LOOM_DATA_DIR=/data
      - LOOM_CONSOLE_DIST=/app/console/dist
      # Worker pool / isolation knobs (see README):
      # - LOOM_WORKER_MAX_IDLE=8
      # - LOOM_WORKER_MAX_JOBS=128
      # - LOOM_ISOLATION=process
    expose:
      - "7420"
    volumes:
      - loom-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7420/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  loom-data:
